app = "api-presentation"
primary_region = "bog"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PREFIX = "/api/v1"
  I18N_SOURCE_LANG = "es"
  I18N_TARGET_LANGUAGES = "en,pt"
  TRANSLATION_API_URL = "https://api.mymemory.translated.net/get"
  TRANSLATION_DELAY_MS = "350"
  SUPABASE_STORAGE_BUCKET = "portfolio-assets"
  UPLOAD_MAX_FILES = "3"
  UPLOAD_MAX_SIZE_MB = "5"
  GROQ_MODEL = "llama-3.1-8b-instant"
  CHAT_MAX_TURNS = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
